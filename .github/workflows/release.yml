name: Release

# Push a tag like v2.3.0 (or v2.3.0-rc1 for a pre-release) to build, test and attach the zip to a GitHub Release.
# This does NOT publish to the Chrome Web Store or Edge Add-ons.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write        # only this workflow can create releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Tag must match manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./manifest.json').version")"
          BASE="${TAG%%-*}"
          [ "$BASE" = "$VER" ] || { echo "tag $GITHUB_REF_NAME != manifest version $VER"; exit 1; }

      - run: npm run validate
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dsp
      - run: npm run test:e2e
      - run: npm audit --omit=dev

      - name: Build zip
        run: npm run pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(awk -v v="${GITHUB_REF_NAME#v}" 'index($0,"## ["v"]"){f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md)"
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Volume+ $GITHUB_REF_NAME" \
            --notes "${NOTES:-See CHANGELOG.md}" $FLAGS
