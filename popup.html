<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volume+</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #161618;
      --border: #2a2a2e;
      --accent: #e8ff47;
      --accent-dim: rgba(232,255,71,0.1);
      --text: #f0f0f0;
      --muted: #55555e;
      --red: #ff4444;
      --green: #47ffb2;
    }

    body {
      width: 270px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      padding: 18px;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo {
      width: 26px; height: 26px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .logo svg { width: 14px; height: 14px; }

    .brand { line-height: 1; }
    .brand-top {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--muted); text-transform: uppercase;
    }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }

    /* ---- Animations ---- */

    @keyframes popup-in {
      from { opacity: 0; transform: translateY(6px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    @keyframes status-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(232,255,71,0.35); }
      70%  { box-shadow: 0 0 0 7px rgba(232,255,71,0);   }
      100% { box-shadow: 0 0 0 0 rgba(232,255,71,0);     }
    }

    body {
      animation: popup-in 0.18s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* Volume number */
    .vol-display {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px 10px;
      margin-bottom: 14px;
      transition: border-color 0.3s, background 0.3s;
    }

    .vol-display.boosted {
      border-color: rgba(232,255,71,0.3);
      background: rgba(232,255,71,0.04);
    }

    .vol-num {
      font-family: 'DM Mono', monospace;
      font-size: 48px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--accent);
      transition: color 0.3s ease;
      will-change: color;
    }
    .vol-num.normal { color: var(--green); }
    .vol-num.danger { color: var(--red); }

    .vol-unit { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 3px; }

    /* Slider */
    .slider-section { margin-bottom: 14px; }

    .slider-labels {
      display: flex; justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: 9px; color: var(--muted);
      margin-bottom: 5px; padding: 0 1px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%; height: 5px;
      background: var(--border);
      border-radius: 99px; outline: none; cursor: pointer;
      transition: background 0.2s;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(232,255,71,0.4);
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1),
                  box-shadow 0.15s ease;
    }
    input[type=range]:hover::-webkit-slider-thumb {
      transform: scale(1.25);
      box-shadow: 0 0 16px rgba(232,255,71,0.6);
    }
    input[type=range]:active::-webkit-slider-thumb {
      transform: scale(1.1);
      animation: pulse-ring 0.5s ease-out;
    }

    /* Presets */
    .presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }

    .preset {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 0;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s, color 0.15s,
                  background 0.15s, transform 0.1s cubic-bezier(0.34,1.56,0.64,1);
    }
    .preset:hover  { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
    .preset:active { transform: scale(0.95); }
    .preset.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.05);
    }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* Custom input row */
    .row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }

    .row-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--muted);
      white-space: nowrap;
    }

    .custom-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      text-align: center;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .custom-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232,255,71,0.1);
    }

    /* Boost toggle */
    .boost-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
    }
    .boost-row:hover { border-color: var(--accent); transform: scale(1.01); }
    .boost-row:active { transform: scale(0.99); }
    .boost-row.active { border-color: var(--accent); background: var(--accent-dim); }

    .boost-info { display: flex; flex-direction: column; gap: 2px; }
    .boost-title { font-size: 13px; font-weight: 700; }
    .boost-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--muted);
      transition: color 0.2s;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 34px; height: 18px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 99px;
      transition: background 0.25s, border-color 0.25s;
      cursor: pointer;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      left: 3px; top: 3px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
                  background 0.25s;
    }
    .toggle input:checked + .toggle-track { background: var(--accent-dim); border: 1px solid var(--accent); }
    .toggle input:checked + .toggle-track::after { transform: translateX(16px); background: var(--accent); }

    /* Status */
    .status {
      margin-top: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--muted);
      text-align: center; min-height: 13px;
      transition: color 0.2s;
    }
    .status.ok   { color: var(--green); }
    .status.warn { color: var(--accent); }
    .status.err  { color: var(--red); }
    .status.animate { animation: status-in 0.2s ease both; }
    /* Credit */
    .credit {
      margin-top: 14px;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }
    .credit a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .credit a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 5.5L7 3v10L3 10.5V5.5Z" fill="#0d0d0f"/>
        <path d="M9 5a4 4 0 0 1 0 6" stroke="#0d0d0f" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M11 3a7 7 0 0 1 0 10" stroke="#0d0d0f" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand">
      <div class="brand-name">Volume+</div>
    </div>
  </div>

  <div class="vol-display">
    <div class="vol-num normal" id="volNum">100</div>
    <div class="vol-unit">% volume</div>
  </div>

  <div class="slider-section">
    <div class="slider-labels" id="sliderLabels">
      <span>0%</span><span>50%</span><span>100%</span>
    </div>
    <input type="range" id="volSlider" min="0" max="100" value="100" step="1" aria-label="Volume level" />
  </div>

  <div class="presets" id="presetRow">
    <button class="preset" data-val="0">0</button>
    <button class="preset" data-val="25">25</button>
    <button class="preset" data-val="50">50</button>
    <button class="preset" data-val="75">75</button>
    <button class="preset active" data-val="100">100</button>
  </div>

  <div class="divider"></div>

  <div class="row">
    <span class="row-label">Custom</span>
    <input type="number" class="custom-input" id="customInput" min="0" max="100" placeholder="0–100" />
    <span class="row-label" id="customMax">/ 100%</span>
  </div>

  <div class="boost-row" id="boostRow">
    <div class="boost-info">
      <span class="boost-title">Boost Mode</span>
      <span class="boost-sub" id="boostSub">Enable volume beyond 100%</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="boostToggle" aria-label="Boost Toggle" />
      <span class="toggle-track"></span>
    </label>
  </div>

  <div class="status" id="status">Open YouTube to control volume</div>

  <div class="credit">by <a rel="noopener" href="https://relaxlikes.com" target="_blank">relaxlikes.com</a></div>

  <script src="popup.js"></script>
</body>
</html>
